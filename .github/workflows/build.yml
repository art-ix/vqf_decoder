name: build

on:
  push:
  pull_request:

jobs:
  decoder:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build TwinVQ library and CLI
        run: |
          msbuild tools\vqf_decode.vcxproj /p:Configuration=Release /p:Platform=x64 /m /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test IMDCT, tags and seeking
        run: |
          .\bin\x64\Release\vqf_decode.exe --test-imdct
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($sample in @('audio\koshuks-40kb.vqf', 'audio\koshuks-96kb.vqf')) {
            .\bin\x64\Release\vqf_decode.exe --test-tags $sample
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\bin\x64\Release\vqf_decode.exe --test-seek $sample
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
